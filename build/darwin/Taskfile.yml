version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the application (natively on macOS)
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          DEV:
            ref: .DEV
    cmds:
      - '{{if eq .DEV "true"}}go build -buildvcs=false -gcflags=all="-l"{{else}}go build -tags production -trimpath -buildvcs=false -ldflags="-w -s"{{end}} -o "{{.BIN_DIR}}/{{.APP_NAME}}" .'
    env:
      GOOS: darwin
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'

  package:
    summary: Packages the app into a .app bundle (with the pi sidecar)
    deps:
      - task: build
      - task: build:sidecar
    cmds:
      - task: create:app:bundle

  build:sidecar:
    summary: Builds the pi sidecar into build/sidecar/ (needs bun)
    cmds:
      - bash scripts/build-sidecar.sh

  create:app:bundle:
    summary: Assembles coconut.app (binary + sidecar payload + plist + icon)
    cmds:
      - rm -rf "{{.BIN_DIR}}/{{.APP_NAME}}.app"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS/"
      # Sidecar payload (coconut-pi + pi runtime assets + coconut-extension.ts)
      # travels next to the app binary: piadapter.ResolveBinary and
      # resolveExtensionPath look there first.
      - cp -R "build/sidecar/." "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS/"
      - cp "build/darwin/Info.plist" "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/"
      - |
        if [ -f build/darwin/iconfile.icns ]; then
          cp build/darwin/iconfile.icns "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources/"
        else
          echo "warning: build/darwin/iconfile.icns missing; app will have no icon"
        fi
      - task: codesign:adhoc

  codesign:adhoc:
    summary: Ad-hoc signs the app bundle
    internal: true
    cmds:
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.APP_NAME}}.app"

  run:
    summary: Runs the app from a .dev.app bundle (dev mode)
    cmds:
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS/"
      - cp "build/darwin/Info.dev.plist" "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Info.plist"
      - |
        if [ -f build/darwin/iconfile.icns ]; then
          cp build/darwin/iconfile.icns "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources/"
        fi
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
      - '"{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS/{{.APP_NAME}}"'
